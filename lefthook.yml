glob_matcher: doublestar

pre-commit:
  commands:
    biome-check:
      glob: "**/*.{js,ts,jsx,tsx,json}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  commands:
    type-check:
      run: pnpm compile

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
