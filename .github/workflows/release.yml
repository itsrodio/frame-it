name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to rebuild assets for (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  # 1. Automated versioning, CHANGELOG.md, and Release PR / GitHub Release creation
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # 2. Build for Chrome (Edge, Brave, Opera, Arc) and Firefox on Linux runner
  build-webextensions:
    name: Build Chrome & Firefox
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag_name || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG_NAME }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Zip extension (Chrome / Chromium)
        run: pnpm zip
      - name: Zip extension (Firefox + Sources)
        run: pnpm zip:firefox

      - name: Upload Chrome & Firefox assets to Release
        run: gh release upload "$TAG_NAME" .output/*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Chrome Web Store
        run: pnpm exec wxt submit --chrome-zip .output/*-chrome.zip
        env:
          CHROME_API_VERSION: v1.1
          CHROME_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}

  # 3. Build macOS .app for Safari on macOS runner (ad-hoc signed)
  build-safari:
    name: Build Safari (macOS)
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-latest
    env:
      TAG_NAME: ${{ inputs.tag_name || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG_NAME }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Safari web bundle (MV3)
        run: pnpm build:safari

      - name: Convert to Xcode project
        run: |
          xcrun safari-web-extension-converter .output/safari-mv3 \
            --project-location .output/safari-xcode \
            --app-name "Frame It" \
            --bundle-identifier "com.itsrodio.Frame-It" \
            --macos-only \
            --no-open \
            --no-prompt

      - name: Build macOS .app (ad-hoc signed)
        run: |
          PROJECT=".output/safari-xcode/Frame It/Frame It.xcodeproj"
          SCHEME=$(xcodebuild -project "$PROJECT" -list -json | jq -r '.project.schemes[0]')
          xcodebuild -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath .output/safari-build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      - name: Archive Safari .app
        run: |
          VERSION="${TAG_NAME#v}"
          cd ".output/safari-build/Build/Products/Release"
          ditto -c -k --keepParent "Frame It.app" "../../../../frame-it-${VERSION}-safari-macos.zip"

      - name: Upload Safari asset to Release
        run: gh release upload "$TAG_NAME" .output/frame-it-*-safari-macos.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
