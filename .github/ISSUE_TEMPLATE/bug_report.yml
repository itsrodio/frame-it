name: Bug Report
description: Report a bug or unexpected behavior in FrameIt
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please fill in the details below so we can reproduce and fix it quickly.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Tell us what went wrong...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Open FrameIt on '...'
        2. Activate '...'
        3. Click / hover '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Google Chrome
        - Mozilla Firefox
        - Microsoft Edge
        - Brave
        - Arc
        - Safari
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FrameIt Version
      description: Check the version in `chrome://extensions/` (e.g., `0.4.0`).
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Affected Website URL (optional)
      description: Public URL where the issue occurs, if applicable.
      placeholder: "https://example.com"
  - type: textarea
    id: context
    attributes:
      label: Screenshots / Console Logs (optional)
      description: Paste any screenshots, console errors, or additional context.
